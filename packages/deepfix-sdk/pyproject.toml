[project]
name = "deepfix_sdk"
version = "0.1.0"
readme = "README.md"
description = "DeepFix SDK to facilitate the communication with the server."
requires-python = ">=3.12"
dependencies = [
    "datasets>=4.0.0",
    "deepchecks<0.19.0",
    "deepfix-core",
    "huggingface-hub[hf-xet]>=0.34.4",
    "mlflow>=3.3.2",
    "omegaconf>=2.3.0",
    "pandas>=2.2.3",
    "pydantic>=2.11.7",
    "python-dotenv>=1.1.1",
    "rich>=14.1.0",
    "seaborn>=0.13.2",
    "sqlmodel>=0.0.24",
    "tenacity>=9.1.2",
    "typer>=0.16.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
benchmark = [
    "pyyaml>=6.0",
    "litellm>=1.40.0",
]
vision = [
    "torch>=2.0.0",
    "torchvision",
    "torchmetrics",
    "timm>=1.0.19",
    "open-clip-torch",
    "opencv-python-headless>=4.11.0.86",
    "deepchecks[vision]<0.19.0",
    "supervision",
    "albumentations>=2.0.8",
]
nlp = [
    "transformers>=4.57.1",
    "seqeval>=1.2.2",
    "textblob>=0.19.0",
    "fasttext",
]
ir = [
    "python-terrier>=1.0",
    "pyterrier-dr>=0.7.0",
    "ir-datasets>=0.5.11",
    "tiktoken>=0.12.0",
]
all = [
    "deepfix_sdk[vision,nlp,ir]",
]

[tool.ruff]
target-version = "py311"
line-length = 88
lint.select = ["I", "E", "F", "W", "C90"]
lint.ignore = []

[build-system]
requires = ["uv_build>=0.7.19,<0.8.0"]
build-backend = "uv_build"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.uv.sources]
deepchecks = { git = "https://github.com/delcaux-labs/deepchecks.git" }
deepfix-core = {workspace = true}
fasttext = { git = "https://github.com/delcaux-labs/fastText.git" }

[project.scripts]
deepfix-sdk = "deepfix_sdk.cli:main"
