id: "breast_cancer_multicollinearity"
name: "Wisconsin Breast Cancer Multicollinearity Remediation"
description: >-
  Wisconsin Breast Cancer dataset characterized by severe geometric multicollinearity
  among feature groups (radius, perimeter, area, concavity) and small-sample validation constraints.
  The autonomous agent must diagnose high Variance Inflation Factor (VIF), eliminate redundant
  or collinear features without losing predictive signal, and achieve robust cross-validated accuracy.
dataset_name: "breast-cancer"
dataset_uri: "datasets/breast_cancer.csv"
model_name: "baseline_breast_cancer_lr"
model_uri: "models/baseline_breast_cancer_lr.pkl"
target_metric: "accuracy"
target_value: 0.95
max_iterations: 5
expected_defects:
  - "MULTICOLLINEARITY"
  - "HIGH_CORRELATION"
  - "SMALL_SAMPLE_OVERFITTING"
timeout_seconds: 300
tags:
  - "tabular"
  - "multicollinearity"
  - "classification"
  - "smoke"
metadata:
  domain: "medical"
  task_type: "binary_classification"
  recommended_remediations:
    - "VIF pruning"
    - "PCA / feature reduction"
    - "Stratified K-Fold CV"
