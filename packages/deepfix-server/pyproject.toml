[project]
name = "deepfix_server"
version = "0.1.0"
description = "DeepFix server."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "httpx>=0.28.1",
    "mlflow>=3.3.2",
    "pydantic>=2.11.7",
    "pytest>=8.4.1",
    "pytest-asyncio>=0.24.0",
    "python-dotenv>=1.1.1",
    "rich>=14.1.0",
    "typer",
    "deepfix-core",
    "deepfix-kb",
    "pydantic-settings>=2.11.0",
    "openhands-sdk",
    "openhands-tools",
    "openhands-workspace",
    "openhands-agent-server"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 88
lint.select = ["I", "E", "F", "W", "C90"]
lint.ignore = ["E501"]

[build-system]
requires = ["uv_build>=0.7.19,<0.8.0"]
build-backend = "uv_build"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.uv.sources]
deepfix-core = {workspace = true}
deepfix-kb = {workspace = true}

[project.scripts]
deepfix-server = "deepfix_server.cli:main"
