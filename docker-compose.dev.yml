services:

  deepfix-server:
    build:
      context: .
      dockerfile: ./packages/deepfix-server/Dockerfile
    image: deepfix-server:latest
    environment:
      - DEEPFIX_LLM_API_KEY=${DEEPFIX_LLM_API_KEY}
      - DEEPFIX_LLM_BASE_URL=${DEEPFIX_LLM_BASE_URL}
      - DEEPFIX_LLM_MODEL_NAME=${DEEPFIX_LLM_MODEL_NAME}
      - DEEPFIX_LLM_TEMPERATURE=${DEEPFIX_LLM_TEMPERATURE}
      - DEEPFIX_LLM_MAX_TOKENS=${DEEPFIX_LLM_MAX_TOKENS}
      - DEEPFIX_LLM_CACHE=${DEEPFIX_LLM_CACHE}
      - DEEPFIX_LLM_TRACK_USAGE=${DEEPFIX_LLM_TRACK_USAGE}
      - DEEPFIX_SERVER_DATABASE_URL=sqlite:///./deepfix_server.db
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_EXP_NAME=Deepfix-server
    restart: unless-stopped
    command: ["deepfix-server", "launch", "-port", "8844", "-host", "0.0.0.0", "-workers", "1", "--reload"]
    ports:
      - "8844:8844"
    volumes:
      - ./packages:/app/packages
    depends_on:
      - mlflow
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 512M

  mlflow:
    build:
      context: .
      dockerfile: ./Dockerfile.mlflow
    image: deepfix-mlflow:latest
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_SERVER_ALLOWED_HOSTS=mlflow:*,localhost:*
      - MLFLOW_SERVER_CORS_ALLOWED_ORIGINS=*
      - MLFLOW_SERVER_DISABLE_SECURITY_MIDDLEWARE=true
    command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000", "--backend-store-uri", "postgresql+psycopg2://deepfix-admin:deepfix-admin@deepfix-db:5432/deepfix_db", "--default-artifact-root", "/app/mlartifacts", "--workers", "1"]
    volumes:
      - ./server_data/mlflow:/app
    depends_on:
      deepfix-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  deepfix-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: deepfix-admin
      POSTGRES_PASSWORD: deepfix-admin
      POSTGRES_DB: deepfix_db
    ports:
      - "5444:5432"
    volumes:
      - ./server_data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deepfix-admin -d deepfix_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
