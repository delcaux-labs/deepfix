services:

  deepfix-portal:
    build:
      context: .
      dockerfile: ./packages/deepfix-portal/Dockerfile
    image: deepfix-portal:latest
    restart: unless-stopped
    ports:
      - "3000:5041"
    #env_file:
    #  - .env
    environment:
      - DATABASE_URL=postgresql+psycopg2://deepfix-admin:deepfix-admin@deepfix-db:5432/deepfix_portal
      - DEEPFIX_SERVER_URL=http://deepfix-server:8844
      - FRONTEND_URL=http://localhost:5173
      - DEEPFIX_PORTAL_SERVICE_TOKEN=dev-portal-service-token
      - DEEPFIX_PORTAL_SECRET_KEY=dev-secret-key-change-in-production-min-32-characters-long
      - DEEPFIX_PORTAL_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
    command: ["uvicorn", "deepfix_portal.api.main:app", "--host", "0.0.0.0", "--port", "5041", "--reload"]
    volumes:
      - ./packages/deepfix-portal/src:/app/packages/deepfix-portal/src
    depends_on:
      - deepfix-server
      - deepfix-db

  deepfix-server:
    build:
      context: .
      dockerfile: ./packages/deepfix-server/Dockerfile
    image: deepfix-server:latest
    environment:
      - DEEPFIX_LLM_API_KEY=${DEEPFIX_LLM_API_KEY}
      - DEEPFIX_LLM_BASE_URL=https://api.tensorix.ai/v1
      - DEEPFIX_LLM_MODEL_NAME=openai/deepseek/deepseek-v4-flash-0731
      - DEEPFIX_LLM_TEMPERATURE=0.7
      - DEEPFIX_LLM_MAX_TOKENS=8000
      - DEEPFIX_LLM_CACHE=1
      - DEEPFIX_LLM_TRACK_USAGE=1
      - DEEPFIX_SERVER_DATABASE_URL=sqlite:////app/.deepfix/deepfix_server.db
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_EXP_NAME=Deepfix-server
      - OPENHANDS_SUPPRESS_BANNER=1
    restart: unless-stopped
    depends_on:
      - mlflow
    command: ["deepfix-server", "launch", "-port", "8844", "-host", "0.0.0.0", "-workers", "1", "--reload"]
    ports:
      - "8844:8844"
    develop:
      watch:
        - action: sync
          path: ./packages/deepfix-server/src
          target: /app/packages/deepfix-server/src
        - action: sync
          path: ./packages/deepfix-core/src
          target: /app/packages/deepfix-core/src
        - action: sync
          path: ./packages/deepfix-kb/src
          target: /app/packages/deepfix-kb/src
        - action: rebuild
          path: ./packages/deepfix-server/pyproject.toml
        - action: rebuild
          path: ./packages/deepfix-core/pyproject.toml
        - action: rebuild
          path: ./packages/deepfix-kb/pyproject.toml
  
  deepfix-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: deepfix-admin
      POSTGRES_PASSWORD: deepfix-admin
      POSTGRES_DB: deepfix_portal
    ports:
      - "5444:5432"
    volumes:
      - ./server_data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deepfix-admin -d deepfix_portal"]
      interval: 10s
      timeout: 5s
      retries: 5

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_SERVER_ALLOWED_HOSTS="mlflow:*,localhost:*"
      - MLFLOW_SERVER_CORS_ALLOWED_ORIGINS="*"
      - MLFLOW_SERVER_DISABLE_SECURITY_MIDDLEWARE=true
    volumes:
      - ./server_data/mlflow:/app
    depends_on:
      - deepfix-db
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql+psycopg2://deepfix-admin:deepfix-admin@deepfix-db:5432/deepfix_portal

    restart: unless-stopped
