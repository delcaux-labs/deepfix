services:

  deepfix-server:
    build:
      context: .
      dockerfile: ./packages/deepfix-server/Dockerfile
    image: deepfix-server:latest
    environment:
      - DEEPFIX_LLM_API_KEY=${DEEPFIX_LLM_API_KEY}
      - DEEPFIX_LLM_BASE_URL=${DEEPFIX_LLM_BASE_URL}
      - DEEPFIX_LLM_MODEL_NAME=${DEEPFIX_LLM_MODEL_NAME}
      - DEEPFIX_LLM_TEMPERATURE=${DEEPFIX_LLM_TEMPERATURE:-0.7}
      - DEEPFIX_LLM_MAX_TOKENS=${DEEPFIX_LLM_MAX_TOKENS:-8000}
      - DEEPFIX_LLM_CACHE=${DEEPFIX_LLM_CACHE:-1}
      - DEEPFIX_LLM_TRACK_USAGE=${DEEPFIX_LLM_TRACK_USAGE:-1}
      - DEEPFIX_SERVER_DATABASE_URL=sqlite:////app/.deepfix/deepfix_server.db
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      - MLFLOW_EXP_NAME=${MLFLOW_EXP_NAME:-Deepfix-server}
    restart: unless-stopped
    volumes:
      - ./packages:/app/packages
    command: ["deepfix-server", "launch", "-port", "8844", "-host", "0.0.0.0", "-workers", "1"]
    ports:
      - "8844:8844"
      
  deepfix-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: deepfix-admin
      POSTGRES_PASSWORD: deepfix-admin
      POSTGRES_DB: deepfix_portal
    ports:
      - "5444:5432"
    volumes:
      - ./server_data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deepfix-admin -d deepfix_portal"]
      interval: 10s
      timeout: 5s
      retries: 5


volumes:
  rustfs-data: